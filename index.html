<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Испанские банки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Раскладка: одна колонка до 760px, всё крупно; семь банок в два ряда — главный образ страницы. */
:root{
  --bg:#f1f5fb; --surface:#ffffff; --ink:#0d1a33; --muted:#42506b; --line:#bcc8dc;
  --accent:#1746c9; --on-accent:#ffffff; --lid:#f2ae00; --glass:#dfe9f8;
  --ok:#0a6e3c; --ok-bg:#dff5e8; --bad:#b3200f; --bad-bg:#fde5e1;
  --font:"Atkinson Hyperlegible",Verdana,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1222; --surface:#162038; --ink:#f3f6fc; --muted:#b6c2d9; --line:#3a4a6b;
  --accent:#9db9ff; --on-accent:#0b1222; --lid:#ffc634; --glass:#22304f;
  --ok:#6fe0a4; --ok-bg:#103524; --bad:#ff9a8d; --bad-bg:#44180f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1222; --surface:#162038; --ink:#f3f6fc; --muted:#b6c2d9; --line:#3a4a6b;
  --accent:#9db9ff; --on-accent:#0b1222; --lid:#ffc634; --glass:#22304f;
  --ok:#6fe0a4; --ok-bg:#103524; --bad:#ff9a8d; --bad-bg:#44180f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:22px;line-height:1.4;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:26px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--on-accent);border:3px solid var(--accent);border-radius:14px;padding:16px 22px;font-size:24px;font-weight:700;min-height:64px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{font-size:20px;min-height:52px;padding:10px 16px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--lid);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row>.btn{flex:1 1 200px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* выбор имени */
.names{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.names .btn{font-size:30px;min-height:110px}

/* банки */
.jars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px}
.jar{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.jar .lid{width:74%;height:12px;background:var(--lid);border-radius:5px 5px 0 0}
.jar .glass{width:100%;aspect-ratio:3/4;border:3px solid var(--ink);border-radius:10px 10px 18px 18px;background:var(--surface);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.jar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--glass)}
.jar .num{position:relative;font-size:clamp(22px,6vw,38px);font-weight:700;font-variant-numeric:tabular-nums}
.jar .cap{font-size:clamp(13px,3.4vw,18px);line-height:1.2;text-align:center;color:var(--muted)}
.jar .cap b{display:block;color:var(--ink);font-size:clamp(15px,3.8vw,20px)}

/* занятие */
.bar{height:14px;background:var(--glass);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.tag{font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ru{font-size:clamp(36px,9vw,54px);font-weight:700;line-height:1.12;overflow-wrap:anywhere}
.sent{font-size:26px}
#ans{font:inherit;font-size:30px;width:100%;padding:16px;border:3px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink);min-width:0}
.live{min-height:1.4em;font-size:22px;color:var(--muted)}
.verdict{font-size:28px;font-weight:700;padding:14px 18px;border-radius:14px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.es{font-size:clamp(40px,10vw,60px);font-weight:700;line-height:1.1;color:var(--accent);overflow-wrap:anywhere}
.tr{font-size:26px;color:var(--muted)}
.yours{font-size:24px}
.yours s{color:var(--bad)}
.forms{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:26px}
.forms span{color:var(--muted)}
.note{font-size:20px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list div{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:22px}
.list div b{color:var(--accent)}
.status{font-size:18px;color:var(--muted)}
/* занятие: компактно, чтобы всё помещалось над клавиатурой */
body.studying{padding-block:6px 14px}
#study>.wrap{gap:8px}
#study .bar{height:5px;border:0;border-radius:3px}
#ask{padding:10px 14px 12px;gap:6px}
#ask .tag{font-size:13px;letter-spacing:.05em}
#ask .ru{font-size:clamp(34px,10.5vw,52px);line-height:1.08}
#ask .sent{font-size:19px;line-height:1.3}
.ansrow{display:flex;gap:8px;align-items:stretch;margin-top:4px}
.ansrow #ans{flex:1 1 0;font-size:22px;padding:8px 12px;border-width:2px;border-radius:12px;height:52px}
.ic{flex:0 0 52px;height:52px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:28px;font-weight:700;line-height:1;padding:0}
.ic.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
#ask .live{min-height:0;font-size:16px}
#ask .live:empty{display:none}
#res{padding:14px;gap:10px}
#res .verdict{font-size:22px;padding:8px 14px}
#res .es{font-size:clamp(34px,9.5vw,52px)}
#res .tr{font-size:20px}
#res .sent{font-size:20px}
#res .yours{font-size:20px}
#res .forms{font-size:22px;gap:2px 16px}
.forms b{font-weight:400}
.forms b.irr{font-weight:700;color:var(--bad);text-decoration:underline;text-underline-offset:4px}
.linkbtn{background:none;border:0;padding:8px;font-size:17px;color:var(--muted);text-decoration:underline;align-self:center}
@media (max-width:480px){body{font-size:20px}.card{padding:16px}.names .btn{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.bar i,.jar .fill{transition:all .3s}}
</style>

<div class="wrap">

  <section id="pick" class="card">
    <h1>Испанские банки</h1>
    <p>Кто сегодня учит слова?</p>
    <div class="names" id="names"></div>
    <p class="muted" style="font-size:20px">У каждого свои семь банок. Слова переходят из банки в банку, когда вы их вспоминаете.</p>
  </section>

  <section id="home" hidden>
    <div class="wrap">
      <div class="top">
        <h1 id="hello"></h1>
        <button class="btn ghost small" id="switch">Сменить имя</button>
      </div>
      <div class="card">
        <div class="jars" id="jars"></div>
        <p class="muted" style="font-size:19px">Нажмите на банку, чтобы посмотреть слова в ней.</p>
      </div>
      <div class="card">
        <h2 id="planTitle">Сегодня</h2>
        <p id="plan"></p>
        <div class="row">
          <button class="btn" id="start">Начать</button>
          <button class="btn ghost" id="more">Ещё 10 новых слов</button>
        </div>
        <p class="status" id="status"></p>
      </div>
    </div>
  </section>

  <section id="study" hidden>
    <div class="wrap">
      <span id="left" hidden></span>
      <div class="bar"><i id="prog"></i></div>

      <div class="card" id="ask">
        <span class="tag" id="kind"></span>
        <div class="ru" id="qRu"></div>
        <p class="sent" id="qSent"></p>
        <form id="form" class="ansrow" autocomplete="off">
          <button class="ic ghost" type="button" id="dunno" aria-label="Не знаю, показать ответ">?</button>
          <input id="ans" type="text" lang="es" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="по-испански" aria-label="Перевод на испанский">
          <button class="ic" type="submit" aria-label="Проверить">✓</button>
        </form>
        <p class="live" id="live"></p>
        <button type="button" id="mic" hidden></button><p id="micHint" hidden></p>
      </div>

      <div class="card" id="res" hidden>
        <div class="verdict" id="verdict"></div>
        <p class="yours" id="yours" hidden></p>
        <div>
          <div class="es" id="aEs"></div>
          <div class="tr" id="aTr"></div>
        </div>
        <p class="sent" id="aRu"></p>
        <div>
          <p class="sent"><b id="aEx"></b></p>
          <p class="muted" id="aExRu"></p>
        </div>
        <div id="formsBox" hidden>
          <p class="tag" id="formsTitle"></p>
          <div class="forms" id="forms"></div>
        </div>
        <p class="note" id="aNote" hidden></p>
        <div class="row">
          <button class="btn" id="next">Дальше</button>
          <button class="btn ghost" id="say">🔊 Послушать</button>
          <button class="btn ghost" id="override" hidden>Я сказал верно</button>
        </div>
        <button class="linkbtn" type="button" id="stop">Закончить на сегодня</button>
      </div>

      <div class="card" id="done" hidden>
        <h1>На сегодня всё. ¡Muy bien!</h1>
        <p id="doneText"></p>
        <div class="row">
          <button class="btn" id="toHome">К банкам</button>
        </div>
      </div>
    </div>
  </section>

  <section id="list" hidden>
    <div class="wrap">
      <div class="top">
        <h1 id="listTitle"></h1>
        <button class="btn ghost small" id="back">Назад</button>
      </div>
      <div class="card"><div class="list" id="listBody"></div></div>
    </div>
  </section>

</div>

    const vals = await csGet(keys), remote = unpack(keys.map(x => vals[x] || "").join(""));
    if (who !== k) return;
    if (remote.t > (P.t || 0) && !queue.length && $("study").hidden) { P = remote; lsSet(k, P); if (!$("home").hidden) render(); }
    else if ((P.t || 0) > remote.t) { dirty = true; flush(); }
  } catch(e){}
}

/* ---------- банки и план ---------- */
const boxOf = id => P.w[id] ? P.w[id][0] : 1;
function counts(){ const c = [0,0,0,0,0,0,0,0]; WORDS.forEach(w => c[boxOf(w.i)]++); return c; }
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function fresh(n){
  const taken = new Set(P.nt);
  return WORDS.filter(w => !P.w[w.i] && !taken.has(w.i))
    .sort((a, b) => a.l - b.l || hash(who + a.i) - hash(who + b.i)).slice(0, n).map(w => w.i);
}
function dueReviews(){ const t = today(); return Object.keys(P.w).map(Number).filter(id => BY[id] && P.w[id][1] <= t); }
function ensureDay(){
  const t = today();
  if (P.d !== t) { const first = Object.keys(P.w).length === 0; P.d = t; P.nt = []; P.nt = fresh(first ? 30 : 10); save(); }
}
function pendingNew(){ return P.d === today() ? P.nt.filter(id => !P.w[id] && BY[id]) : null; }
function plural(n, a, b, c){ const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; }
const wordsN = n => n + " " + plural(n, "слово", "слова", "слов");

function show(id){
  ["pick","home","study","list"].forEach(s => $(s).hidden = s !== id);
  document.body.classList.toggle("studying", id === "study");
  if (tg && tg.BackButton) { try { (id === "study" || id === "list") ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
  window.scrollTo(0, 0);
}
function pinTop(){ [0, 120, 350, 700].forEach(ms => setTimeout(() => { if (!$("study").hidden && !$("ask").hidden) window.scrollTo(0, 0); }, ms)); }
function regular(inf){
  const refl = /se$/.test(inf), base = refl ? inf.slice(0, -2) : inf, st = base.slice(0, -2), en = base.slice(-2);
  const E = {ar:["o","as","a","amos","áis","an"], er:["o","es","e","emos","éis","en"], ir:["o","es","e","imos","ís","en"]}[en];
  if (!E) return null;
  const R = ["me","te","se","nos","os","se"];
  return E.map((e, i) => (refl ? R[i] + " " : "") + st + e);
}
function render(){
  const name = tgName || (PLAYERS.find(p => p[0] === who) || ["", "Привет"])[1];
  $("hello").textContent = name + ", ¡hola!";
  const c = counts(), max = Math.max(1, ...c.slice(1));
  $("jars").innerHTML = "";
  JARS.forEach((j, i) => {
    const b = document.createElement("button"); b.className = "jar"; b.type = "button";
    b.setAttribute("aria-label", "Банка " + (i + 1) + ": " + wordsN(c[i + 1]));
    b.innerHTML = '<span class="lid"></span><span class="glass"><span class="fill" style="height:' + Math.round(c[i + 1] / max * 100) + '%"></span><span class="num">' + c[i + 1] + '</span></span><span class="cap"><b>Банка ' + (i + 1) + '</b>' + j[0] + '</span>';
    b.onclick = () => openList(i + 1);
    $("jars").appendChild(b);
  });
  const rev = dueReviews().length, pn = pendingNew();
  const firstEver = Object.keys(P.w).length === 0;
  const nw = pn === null ? Math.min(firstEver ? 30 : 10, c[1]) : pn.length;
  let txt;
  if (rev + nw === 0) {
    const next = Object.values(P.w).map(v => v[1]).filter(d => d > today()).sort((a, b) => a - b)[0];
    const days = next ? next - today() : 0;
    txt = "На сегодня всё сделано." + (next ? " Следующее повторение — " + (days === 1 ? "завтра" : "через " + days + " " + plural(days, "день", "дня", "дней")) + "." : "");
  } else {
    txt = (rev ? "Повторить: " + wordsN(rev) + ". " : "") + (nw ? "Новых: " + wordsN(nw) + "." : "");
  }
  $("plan").textContent = txt;
  $("start").hidden = rev + nw === 0;
  $("more").hidden = !(pn !== null && c[1] - pn.length > 0);
  showStatus(); show("home");
}

function openList(box){
  $("listTitle").textContent = "Банка " + box + " — " + JARS[box - 1][1];
  const t = today(), body = $("listBody"); body.innerHTML = "";
  const items = WORDS.filter(w => boxOf(w.i) === box).sort((a, b) => box === 1 ? a.l - b.l || a.ru.localeCompare(b.ru, "ru") : P.w[a.i][1] - P.w[b.i][1]);
  if (!items.length) { const p = document.createElement("p"); p.className = "muted"; p.textContent = "Здесь пока пусто."; body.appendChild(p); }
  items.slice(0, 400).forEach(w => {
    const d = document.createElement("div"), a = document.createElement("span"), b = document.createElement(box === 1 ? "span" : "b");
    a.textContent = w.ru;
    if (box === 1) { b.className = "muted"; b.textContent = ["", "очень важное", "важное", "на потом"][w.l]; }
    else { const k = P.w[w.i][1] - t; b.textContent = w.es + (k <= 0 ? " · сегодня" : " · через " + k + " дн."); }
    d.append(a, b); body.appendChild(d);
  });
  if (items.length > 400) { const p = document.createElement("p"); p.className = "muted"; p.style.paddingTop = "12px"; p.textContent = "…и ещё " + wordsN(items.length - 400) + "."; body.appendChild(p); }
  show("list");
}

/* ---------- занятие ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startSession(){
  ensureDay();
  queue = shuffle(dueReviews()).concat(pendingNew() || []);
  seen = new Set(); total = queue.length; stats = {ok:0, bad:0};
  if (!queue.length) { render(); return; }
  show("study"); ask();
}
function ask(){
  $("res").hidden = true; $("done").hidden = true;
  if (!queue.length) return finish();
  cur = BY[queue[0]];
  $("ask").hidden = false;
  $("left").textContent = "Осталось: " + queue.length;
  $("prog").style.width = Math.round((total - queue.length) / total * 100) + "%";
  $("kind").textContent = KIND[cur.p];
  $("qRu").textContent = cur.ru;
  $("qSent").textContent = cur.xr;
  $("ans").value = ""; $("live").textContent = "";
  try { $("ans").focus({preventScroll:true}); } catch(e){ $("ans").focus(); }
  pinTop();
}
const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const norm = s => s.toLowerCase().replace(/[¿?¡!.,;:"«»()—–]/g, " ").replace(/\s+/g, " ").trim().normalize("NFC");
const ART = /^(el|la|los|las|un|una) /;
function judge(w, raw){
  const a = norm(raw); if (!a) return {ok:false};
  const targets = w.es.split(" / ").map(norm);
  const noun = /^(m|f|mf|pl)$/.test(w.p);
  for (const t of targets) if (a === t) return {ok:true};
  for (const t of targets) if (strip(a) === strip(t)) return {ok:true, note:"Верно, но проверьте ударение и буквы: " + t};
  if (noun) for (const t of targets) {
    const bare = t.replace(ART, "");
    if (strip(a) === strip(bare)) return {ok:true, note:"Слово верное. Запомните с артиклем: " + t};
    if (ART.test(a) && strip(a.replace(ART, "")) === strip(bare)) return {ok:false, note:"Слово верное, но артикль другой: " + t};
  }
  if (w.p === "v" && / a$/.test(targets[0]) && strip(a) === strip(targets[0].replace(/ a$/, ""))) return {ok:true, note:"Верно. После этого глагола обычно идёт «a»."};
  if (w.p === "v" && /se$/.test(targets[0]) && strip(a) === strip(targets[0].replace(/se$/, ""))) return {ok:false, note:"Почти: это возвратный глагол, в конце нужно -se."};
  return {ok:false};
}
function check(raw, gaveUp){
  if (!cur || !$("res").hidden) return;
  const r = gaveUp ? {ok:false} : judge(cur, raw);
  reveal(r, raw, gaveUp);
  apply(r.ok);
}
function promote(id, box, first, t){
  if (box === 1) P.w[id] = [2, t + GAP[2]];
  else if (first) { const nb = Math.min(TOP, box + 1); P.w[id] = [nb, t + GAP[nb]]; }
}
function apply(ok){
  const id = cur.i, t = today(), first = !seen.has(id), box = boxOf(id);
  seen.add(id); lastOk = ok; lastFirst = first; lastBox = box; lastW = P.w[id] ? P.w[id].slice() : null; queue.shift();
  if (ok) {
    stats.ok++;
    promote(id, box, first, t);
  } else {
    stats.bad++;
    // ошибка: на две банки вниз (не ниже второй), повтор завтра
    if (box > 1 && first) P.w[id] = [Math.max(2, box - 2), t + 1];
    queue.push(id);
  }
  save();
}
function reveal(r, raw, gaveUp){
  const w = cur;
  $("ask").hidden = true; $("res").hidden = false;
  const v = $("verdict");
  v.className = "verdict " + (r.ok ? "ok" : "bad");
  v.textContent = r.ok ? "Верно!" : gaveUp ? "Запоминаем:" : "Не совсем. Правильно так:";
  const y = $("yours");
  if (!r.ok && !gaveUp && raw.trim()) { y.hidden = false; y.innerHTML = "Ваш ответ: <s></s>"; y.querySelector("s").textContent = raw.trim(); }
  else y.hidden = true;
  $("aEs").textContent = w.es; $("aTr").textContent = w.tr || "";
  $("aRu").textContent = w.ru;
  $("aEx").textContent = w.ex; $("aExRu").textContent = w.xr;
  const fb = $("formsBox");
  if (w.f) {
    fb.hidden = false;
    const inf = w.inf || w.es.split(" ")[0], reg = regular(inf) || [];
    const irr = w.f.map((f, i) => f !== reg[i]), any = irr.some(Boolean);
    $("formsTitle").textContent = any ? "Неправильный глагол" + (w.inf ? " " + w.inf : "") + " — необычные формы выделены" : "Правильный глагол на -" + inf.replace(/se$/, "").slice(-2) + (w.inf ? " (" + w.inf + ")" : "");
    $("forms").innerHTML = ""; $("forms").hidden = !any;
    if (any) w.f.forEach((f, i) => { const a = document.createElement("span"), b = document.createElement("b"); a.textContent = PRON[i]; b.textContent = f; if (irr[i]) b.className = "irr"; $("forms").append(a, b); });
  } else fb.hidden = true;
  const notes = [r.note, w.n].filter(Boolean);
  $("aNote").hidden = !notes.length; $("aNote").textContent = notes.join(" · ");
  $("override").hidden = r.ok || gaveUp || !raw.trim();
  try { $("ans").blur(); } catch(e){}
  window.scrollTo(0, 0);
}
function overrideOk(){
  if (lastOk) return;
  const id = cur.i, t = today();
  queue.pop(); stats.bad--; stats.ok++; lastOk = true;
  if (lastW) P.w[id] = lastW; else delete P.w[id];
  promote(id, lastBox, lastFirst, t);
  save();
  const v = $("verdict"); v.className = "verdict ok"; v.textContent = "Засчитано!";
  $("override").hidden = true; $("yours").hidden = true;
}
function finish(early){
  stopMic();
  $("ask").hidden = true; $("res").hidden = true; $("done").hidden = false;
  $("prog").style.width = early ? $("prog").style.width : "100%";
  $("left").textContent = "";
  const learned = new Set([...seen].filter(id => !queue.includes(id))).size;
  $("doneText").textContent = "Вспомнили сегодня: " + wordsN(learned) + "." + (queue.length ? " Осталось на потом: " + wordsN(new Set(queue).size) + "." : " Завтра повторим их ещё раз.");
  queue = []; cur = null; dirty = dirty || cloud; flush();
  $("toHome").focus();
}

/* ---------- голос ---------- */
let listening = false, gotFinal = false;
function stopMic(){ if (dict && listening) dict.stop().catch(() => {}); }
function setupDictation(d){
  dict = d; $("mic").hidden = false; $("micHint").hidden = true;
  d.onPartial(e => { if (e.text) $("live").textContent = "Слышу: " + e.text; });
  d.onFinal(e => {
    const el = $("ans"); el.value = (el.value + e.text).trim(); $("live").textContent = "";
    if (!gotFinal && $("res").hidden && cur) { gotFinal = true; d.stop().catch(() => {}).then(() => { if ($("res").hidden && cur) check($("ans").value, false); }); }
  });
  d.onState(e => {
    listening = e.state !== "idle";
    $("mic").textContent = listening ? "■ Стоп" : "🎤 Сказать";
    if (e.state === "listening") $("live").textContent = "Говорите по-испански…";
    if (e.state === "idle" && (e.reason === "not_granted" || e.reason === "unavailable")) { $("mic").hidden = true; $("micHint").hidden = false; $("live").textContent = "Микрофон недоступен — напишите ответ."; }
  });
  $("mic").onclick = () => {
    if (listening) { d.stop().catch(() => {}); return; }
    gotFinal = false; $("ans").value = "";
    d.start({language:"es"}).catch(e => {
      if (e && (e.code === "not_granted" || e.code === "unavailable")) { $("mic").hidden = true; $("micHint").hidden = false; $("live").textContent = "Микрофон недоступен — напишите ответ."; }
    });
  };
}
function speak(){
  if (!cur && !$("aEs").textContent) return;
  const text = $("aEs").textContent.split(" / ")[0] + ". " + $("aEx").textContent;
  if (tts) { tts.speak(text, {language:"es", rate:0.8}).catch(() => {}); return; }
  try { const u = new SpeechSynthesisUtterance(text); u.lang = "es-ES"; u.rate = 0.8; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){}
}

/* ---------- запуск ---------- */
PLAYERS.forEach(([k, name]) => {
  const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = name;
  b.onclick = () => { try { localStorage.setItem("banki:last", k) } catch(e){} loadPlayer(k); };
  $("names").appendChild(b);
});
$("switch").onclick = () => { flush(); who = null; show("pick"); };
$("start").onclick = startSession;
$("more").onclick = () => { ensureDay(); P.nt = P.nt.concat(fresh(10)); save(); startSession(); };
$("stop").onclick = () => finish(true);
$("form").addEventListener("submit", e => { e.preventDefault(); if ($("ans").value.trim()) check($("ans").value, false); else $("ans").focus(); });
$("dunno").onclick = () => check("", true);
$("next").onclick = ask;
$("say").onclick = speak;
$("override").onclick = overrideOk;
$("toHome").onclick = render;
$("back").onclick = render;
if (!("speechSynthesis" in window)) $("say").hidden = true;

if (tg) {
  try { tg.ready(); tg.expand(); } catch(e){}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
  try { tg.BackButton.onClick(() => { if (!$("study").hidden && $("done").hidden) finish(true); else render(); }); } catch(e){}
  $("ans").addEventListener("focus", pinTop);
  if (window.visualViewport) visualViewport.addEventListener("resize", pinTop);
  const theme = () => document.documentElement.setAttribute("data-theme", tg.colorScheme === "dark" ? "dark" : "light");
  theme(); try { tg.onEvent("themeChanged", theme); } catch(e){}
  tgName = (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "";
  $("switch").hidden = true;
  loadPlayer("me");
}
</script>
